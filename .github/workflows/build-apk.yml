
name: RAID Ultimate Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v4

      - name: İmza dosyasını oluştur ve kontrol et
        env:            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEY_DATA" ]; then
            echo "HATA: Base64 Secret boş."
            exit 1
          fi
          printf '%s' "$KEY_DATA" | base64 --decode > app/release-key.jks
          if [ ! -s app/release-key.jks ]; then
            echo "HATA: İmza dosyası oluşturulamadı."
            exit 1
          fi
          echo "İmza dosyası başarıyla oluşturuldu."

      - name: Debug APK derle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run:         run: |
          set -e
          printf '%s' "$KEY_DATA" | base64 --decode > app/release-key.jks
          echo "Dosya boyutu:"
          wc -c app/release-key.jks
          echo "Keystore doğrulaması:"
          keytool -list \
            -keystore app/release-key.jks \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: RAID-Ultimate-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
